[package]
name = "transfor"
version = "1.0.0"
edition = "2024"
description = "A high-performance CLI for data plumbing and format transformation."
license = "MIT"
readme = "README.md"
repository = "https://github.com/Jacques-Murray/transfor"
authors = ["Jacques Murray <jacquesmmurray@gmail.com>"]

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Core data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Format-specific serializers/deserializers
toml = "0.8"
csv = "1.3"

# Error handling
thiserror = "1.0"

[dev-dependencies]
# For integration tests
assert_cmd = "2.0"
predicates = "3.1"
